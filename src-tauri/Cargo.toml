[package]
name = "core_launcher"
version = "1.0.0"
description = "High-Performance Modern Minecraft Launcher"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
futures-util = "0.3"
sha1 = "0.10"
hex = "0.4"
zip = "0.6"
image = "0.24"
dirs = "5.0"
sys-info = "0.9"
log = "0.4"
env_logger = "0.10"
